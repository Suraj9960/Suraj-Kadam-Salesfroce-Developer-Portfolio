<template>

    <section class="contact-section" id="contact">

        <!-- Background Glow -->
        <div class="bg-circle bg1"></div>
        <div class="bg-circle bg2"></div>

        <!-- Section Header -->

        <div class="section-header">

            <span class="section-tag">

                GET IN TOUCH

            </span>

            <h2>

                Let's Work Together

            </h2>

            <p>

                I'm always open to discussing Salesforce opportunities,
                exciting projects, and innovative CRM solutions.
                Feel free to reach out!

            </p>

        </div>

        <!-- Contact Container -->

        <div class="contact-container">

            <!-- ===================================== -->
            <!-- LEFT -->
            <!-- ===================================== -->

            <div class="contact-info">

                <h3>

                    Contact Information

                </h3>

                <p>

                    Whether you have a Salesforce opportunity,
                    project, or simply want to connect,
                    I'd love to hear from you.

                </p>

                <!-- Email -->

                <div class="info-card">

                    <div class="icon">

                        📧

                    </div>

                    <div>

                        <h4>Email</h4>

                        <span>

                            surajkadam9960@gmail.com

                        </span>

                    </div>

                </div>

                <!-- Phone -->

                <div class="info-card">

                    <div class="icon">

                        📱

                    </div>

                    <div>

                        <h4>Phone</h4>

                        <span>

                            +91 9021913916

                        </span>

                    </div>

                </div>

                <!-- Location -->

                <div class="info-card">

                    <div class="icon">

                        📍

                    </div>

                    <div>

                        <h4>Location</h4>

                        <span>

                            Pune, Maharashtra

                        </span>

                    </div>

                </div>

                <!-- Company -->

                <!-- Social -->

                
            </div>

            <!-- ===================================== -->
            <!-- RIGHT -->
            <!-- ===================================== -->

            <div class="contact-form">

                <h3>

                    Send a Message

                </h3>

                <form>

                    <div class="input-group">

                        <input
                            type="text"
                            placeholder="Your Name"
                            onchange={handleNameChange}
                            >

                    </div>

                    <div class="input-group">

                        <input
                            type="email"
                            placeholder="Email Address"
                            onchange={handleEmailChange}
                            >

                    </div>

                    <div class="input-group">

                        <input
                            type="text"
                            placeholder="Subject"
                            onchange={handleSubjectChange}>

                    </div>

                    <div class="input-group">

                        <textarea
                            rows="6"
                            placeholder="Write your message..."
                            onchange={handleMessageChange}>

                        </textarea>

                    </div>

                    <button
                        type="submit"
                        class="send-btn"
                        onclick={sendEmail}
                        >

                        Send Message

                    </button>

                </form>

            </div>

        </div>

    </section>

</template>
